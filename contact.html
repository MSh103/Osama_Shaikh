    <main>
       <div class="contact">
            <h1>Contact Me</h1>
            <br/>
            <p>You can find me on linkedin and you can directly contact me via email or the contact form below.</p>

            <form id="contactForm"
                  name="contact"
                  method="POST"
                  data-netlify="true"
                  netlify-honeypot="bot-field"
                  data-netlify-recaptcha="true">

              <input type="hidden" name="form-name" value="contact">

              <div class="hp">
                <input name="bot-field" tabindex="-1" autocomplete="off" aria-hidden="true">
              </div>
          
              <input type="text" name="name" placeholder="Your Name" required>
              <input type="email" name="email" placeholder="Your Email" required>
              <textarea name="subject" rows="2" placeholder="Subject" required></textarea>
              <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
          
              <div data-netlify-recaptcha="true"></div>
          
              <button data-netlify-recaptcha="true" type="submit">Send Message</button>
            </form>


       </div>
       <div class="socials">

       </div>
    </main>
